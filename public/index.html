<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>مدیریت سوراخ‌ها | ثبت مشتری</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#0f0c29;
    --bg2:#302b63;
    --bg3:#24243e;
    --accent:#7f5af0;
    --accent2:#2cb67d;
    --glass:rgba(255,255,255,0.06);
    --glass-border:rgba(255,255,255,0.14);
    --text:#f4f4f8;
    --muted:#a6a6b3;
    --danger:#ef4565;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:'Vazirmatn', sans-serif;
    background:linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
    background-size:200% 200%;
    animation:gradientMove 18s ease infinite;
    color:var(--text);
    display:flex;
    justify-content:center;
    padding:40px 16px;
  }
  @keyframes gradientMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }
  .wrap{
    width:100%;
    max-width:760px;
  }
  header{
    text-align:center;
    margin-bottom:28px;
  }
  header h1{
    font-size:28px;
    font-weight:800;
    margin:0 0 6px;
    background:linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  header p{
    color:var(--muted);
    margin:0;
    font-size:14px;
  }
  .card{
    background:var(--glass);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-radius:22px;
    padding:24px;
    box-shadow:0 8px 32px rgba(0,0,0,0.35);
    margin-bottom:24px;
  }
  .form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  .form-grid .full{grid-column:1 / -1;}
  label{
    display:block;
    font-size:13px;
    color:var(--muted);
    margin-bottom:6px;
  }
  input, textarea{
    width:100%;
    padding:12px 14px;
    border-radius:12px;
    border:1px solid var(--glass-border);
    background:rgba(255,255,255,0.05);
    color:var(--text);
    font-family:inherit;
    font-size:15px;
    outline:none;
    transition:border 0.2s, background 0.2s;
  }
  input:focus, textarea:focus{
    border-color:var(--accent);
    background:rgba(255,255,255,0.09);
  }
  textarea{resize:vertical; min-height:60px;}
  .btn{
    border:none;
    cursor:pointer;
    font-family:inherit;
    font-weight:700;
    font-size:15px;
    border-radius:12px;
    padding:12px 20px;
    transition:transform 0.15s, opacity 0.15s;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{
    background:linear-gradient(90deg, var(--accent), #6246ea);
    color:#fff;
    width:100%;
    margin-top:16px;
  }
  .btn-primary:hover{opacity:0.92;}
  .search-box{
    margin-bottom:16px;
  }
  .search-box input{
    background:rgba(255,255,255,0.05);
  }
  table{
    width:100%;
    border-collapse:collapse;
  }
  thead th{
    text-align:right;
    font-size:12px;
    color:var(--muted);
    padding:8px 10px;
    border-bottom:1px solid var(--glass-border);
    font-weight:600;
  }
  tbody td{
    padding:12px 10px;
    font-size:14px;
    border-bottom:1px solid rgba(255,255,255,0.06);
    vertical-align:middle;
  }
  tbody tr{transition:background 0.15s;}
  tbody tr:hover{background:rgba(255,255,255,0.04);}
  .hole-badge{
    display:inline-block;
    background:linear-gradient(90deg, var(--accent2), #16a085);
    color:#fff;
    font-weight:700;
    padding:4px 12px;
    border-radius:20px;
    font-size:13px;
  }
  .row-actions{
    display:flex;
    gap:6px;
    justify-content:flex-end;
  }
  .icon-btn{
    background:rgba(255,255,255,0.07);
    border:1px solid var(--glass-border);
    color:var(--text);
    width:34px;
    height:34px;
    border-radius:10px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:15px;
    transition:background 0.15s;
  }
  .icon-btn:hover{background:rgba(255,255,255,0.15);}
  .icon-btn.danger:hover{background:rgba(239,69,101,0.25); border-color:var(--danger);}
  .empty{
    text-align:center;
    color:var(--muted);
    padding:30px 10px;
    font-size:14px;
  }
  .note-text{
    color:var(--muted);
    font-size:12px;
  }
  .count-pill{
    display:inline-block;
    background:rgba(127,90,240,0.18);
    border:1px solid rgba(127,90,240,0.4);
    color:#c9b8ff;
    padding:3px 10px;
    border-radius:20px;
    font-size:12px;
    margin-inline-start:8px;
  }
  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:#1e1e2e;
    border:1px solid var(--glass-border);
    color:var(--text);
    padding:12px 22px;
    border-radius:14px;
    font-size:14px;
    opacity:0;
    pointer-events:none;
    transition:all 0.25s;
    box-shadow:0 8px 24px rgba(0,0,0,0.4);
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
  footer{
    text-align:center;
    color:var(--muted);
    font-size:12px;
    margin-top:10px;
  }
  @media(max-width:520px){
    .form-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>مدیریت سوراخ‌ها</h1>
    <p>ثبت نام مشتری و شماره سوراخ — دیتابیس محلی، پایدار در برابر رفرش</p>
  </header>

  <div class="card">
    <form id="recordForm">
      <div class="form-grid">
        <div>
          <label for="customerName">نام مشتری</label>
          <input type="text" id="customerName" placeholder="مثلاً: علی رضایی" required />
        </div>
        <div>
          <label for="holeNumber">شماره سوراخ</label>
          <input type="text" id="holeNumber" placeholder="مثلاً: ۱۲" required />
        </div>
        <div class="full">
          <label for="note">توضیحات (اختیاری)</label>
          <textarea id="note" placeholder="یادداشت..."></textarea>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" id="submitBtn">افزودن رکورد</button>
    </form>
  </div>

  <div class="card">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="جستجو بر اساس نام مشتری یا شماره سوراخ..." />
    </div>
    <table>
      <thead>
        <tr>
          <th>نام مشتری<span class="count-pill" id="countPill">۰</span></th>
          <th>شماره سوراخ</th>
          <th>توضیحات</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="recordsBody"></tbody>
    </table>
    <div id="emptyState" class="empty" style="display:none;">هنوز رکوردی ثبت نشده است.</div>
  </div>

  <footer>ذخیره‌سازی روی سرور محلی شما انجام می‌شود و با رفرش پاک نمی‌شود.</footer>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
